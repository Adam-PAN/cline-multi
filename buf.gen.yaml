version: v2
managed:
  enabled: true
plugins:
  - local: ["npx", "ts-proto"]
    out: src/shared/proto
    opt:
      - env=both
      - esModuleInterop=true
      - outputServices=generic-definitions
      - outputIndex=true
      - useOptionals=none
      - useDate=false
inputs:
  - directory: proto
